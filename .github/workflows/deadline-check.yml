name: Milestone Deadline Check

on:
  schedule:
    # Run every day at 08:00 UTC+7 (01:00 UTC)
    - cron: '0 1 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  check-milestones:
    name: 📅 Check Upcoming & Overdue Milestones
    runs-on: ubuntu-latest

    steps:
      - name: Check milestones and comment on open issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const now = new Date();
            const warningDays = 3; // warn 3 days before deadline

            // Fetch all open milestones
            const { data: milestones } = await github.rest.issues.listMilestones({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            for (const ms of milestones) {
              if (!ms.due_on) continue;

              const due = new Date(ms.due_on);
              const diffMs = due - now;
              const diffDays = Math.ceil(diffMs / (1000 * 60 * 60 * 24));

              let alertType = null;
              let emoji = '';
              let message = '';

              if (diffDays < 0) {
                alertType = 'overdue';
                emoji = '🚨';
                message = This milestone is **OVERDUE** by  day(s)!;
              } else if (diffDays <= warningDays) {
                alertType = 'warning';
                emoji = '⚠️';
                message = This milestone is due in ** day(s)**. Please wrap up!;
              } else {
                continue; // No alert needed
              }

              // Get open issues in this milestone
              const { data: issues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                milestone: ms.number,
                state: 'open',
                per_page: 100,
              });

              console.log(Milestone "": ,  open issues);

              for (const issue of issues) {
                if (issue.pull_request) continue; // skip PRs

                const assignees = issue.assignees.map(a => @).join(', ');
                const dueStr = due.toLocaleDateString('th-TH', {
                  year: 'numeric', month: 'long', day: 'numeric', timeZone: 'Asia/Bangkok'
                });

                const body = [
                  ##  Milestone Deadline Alert — ****,
                  `,
                  | | |,
                  |---|---|,
                  | **Deadline** |  |,
                  | **Status** |  |,
                  | **Assignee(s)** |  |,
                  `,
                  message,
                  `,
                  > _This is an automated reminder from GitHub Actions. Please update the issue status or contact your team lead._,
                ].join('\n');

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body,
                });
              }
            }
            console.log('Milestone check complete.');
