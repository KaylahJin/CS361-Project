name: PR Review Notifications

on:
  pull_request:
    types: [opened, ready_for_review, review_requested]
  pull_request_review:
    types: [submitted]

permissions:
  issues: write
  pull-requests: write

jobs:
  notify-reviewer:
    name: 📢 Notify Reviewer on PR Open / Ready
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      (github.event.action == 'opened' || github.event.action == 'ready_for_review' || github.event.action == 'review_requested')

    steps:
      - name: Post comment to PR asking reviewer
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const mention = (user) => `@${user.login}`;
            const list = (users) => (users.length ? users.map(mention).join(', ') : '-');
            const body = [
              '## 🔔 PR Review Request',
              '',
              `**Assignee(s):** ${list(pr.assignees)}`,
              `**Requested Reviewer(s):** ${list(pr.requested_reviewers)}`,
              '',
              '> This PR is **ready for review**. Please check the changes and leave feedback. 🙏',
              '',
              '| Check | Status |',
              '|-------|--------|',
              '| CI Lint & Type-check | ⏳ Running... |',
              '| Unit Tests | ⏳ Running... |',
              '| Build | ⏳ Running... |',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body,
            });

  notify-review-done:
    name: 📣 Notify Assignee When Review Submitted
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_review' && github.event.action == 'submitted'

    steps:
      - name: Comment on PR after review
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const review = context.payload.review;
            const pr = context.payload.pull_request;
            const reviewer = review.user.login;
            const state = review.state;
            const assignees = pr.assignees.map((a) => `@${a.login}`).join(', ');

            const stateEmoji = {
              APPROVED: '✅',
              CHANGES_REQUESTED: '🔄',
              COMMENTED: '💬',
            }[state] || '📝';

            const stateText = {
              APPROVED: 'approved this PR',
              CHANGES_REQUESTED: 'requested changes',
              COMMENTED: 'left a comment',
            }[state] || 'reviewed this PR';

            // Quote every line, so a multi-line review stays one quote block.
            const quoted = review.body
              ? review.body.split('\n').map((line) => `> ${line}`).join('\n')
              : '';

            const body = [
              `## ${stateEmoji} Review Update`,
              `**Reviewer @${reviewer}** has ${stateText}.`,
              assignees ? `**Assignee(s)** ${assignees} — please check the review and respond accordingly.` : '',
              quoted,
            ].filter(Boolean).join('\n\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body,
            });
